# Bundle patch for cremator-dsh. Selected through `dsh.bundle.patch`.
#
# It contributes one row: the plugin itself. Install the package into a dsh
# profile (`dsh plugin --profile <name> add link:<path>`), then select the
# bundle; do not also insert the row by hand. Two rows with one id make the
# settings form unaddressable.
#
# The config is the documented example, not a fixed policy: a profile patch
# after the bundle layer can override any key. `pruneThresholdTokens` arms the
# depth-triggered table; omit it and only the manual `/cremate` command runs a
# pass.
#
# `contextWindowTokens` is deliberately NOT set here. A bundled default has to
# be right for every user's routed model, and a hardcoded window is not: the
# trigger's 75% skip line is derived from it, so a value smaller than the real
# window retires the trigger early (400000 on a 1M-token model stops at 300000
# and leaves 700000 unused), and a value larger than the real window retires it
# never. Left unset, the mount resolves the ROUTED model's own window through
# the host's `llm.resolveModelInfo` seam (ADR-0071) and re-resolves on a model
# switch. A deployment that wants a fixed number sets it in its profile patch.
- insert:
    - id: cremator
      name: 'cremator-dsh/plugin'
      config:
        barBytes: 512
        enforcement: apply
        pruneThresholdTokens: 60000
        # `/cremate gc` keeps this many recent sessions and removes the rest.
        # Storage never expires on its own, so a sweep is the only way to bound
        # it; 0 (the resolver's default) means a sweep removes nothing.
        gcRetainSessions: 20
        entryAskTrigger: { mode: 'off' }
        nativeCompactionBackstop: true
